# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

project:
  name: "Sprout Patrol"
  genre: "Arcade maze / trail collector (Iggle Pop-inspired)"
  version: "1.16.0"
  stage: Production
  kind: game

modes:
  rigor: standard
  automation: guided

platform:
  multiplayer: false
  online: true               # opt-in cloud save (Claude account in Claude, Google/Firebase on GitHub Pages)
  targets: [Web, Mobile]
  primary_input: "Touch (swipe / thumb pad)"
  gamepad_support: "None"
  touch_support: "Full"
  cert_tier: none

engine:
  name: "Web"                # custom: no engine. HTML5 Canvas 2D + vanilla JavaScript, shipped as ONE html file
  version: "ES2020"
  language: "JavaScript"
  rendering: "Canvas 2D"
  physics: "none (grid-based)"

specialists:
  code: "gameplay-programmer"
  shader: "technical-artist"
  ui: "ui-programmer"
  additional: []

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE
  signals: on_event_name
  files: kebab-case
  scenes: kebab-case

accessibility:
  target: standard           # greyscale/CVD-readable, telegraph >= 0.4 s, reduced motion respected, flash <= 3/s

performance:
  target_framerate: 60
  frame_budget_ms: 16.67
  draw_call_limit: null
  memory_ceiling_mb: null
  enforce: warn

commands:
  build: "python3 tools/build.py --check"
  test: "bash tests/run.sh"
  run: "python3 -m http.server 8765  # then open http://localhost:8765/"
  smoke: "node tests/smoke/err.js dist/sprout-patrol.html"

features:
  session_state: on
